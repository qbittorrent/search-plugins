name: CI - Plugins

on:
  pull_request:
    paths:
      - 'nova3/**'
      - 'rutracker_public.py'
      - 'x1337x.py'
      - 'unofficial/**'
      - 'test_*.py'
      - 'forum_1950.html'
      - '.github/workflows/ci_plugins.yaml'
  push:
    paths:
      - 'nova3/**'
      - 'rutracker_public.py'
      - 'x1337x.py'
      - 'unofficial/**'
      - 'test_*.py'
      - 'forum_1950.html'
      - '.github/workflows/ci_plugins.yaml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

jobs:
  standalone-tests:
    name: Standalone plugin tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest test_rutracker_public test_x1337x test_unofficial_updates test_public_indexes -v

  ci:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15-dev']
    defaults:
      run:
        working-directory: nova3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup environment
        run: |
          pip install uv
          uv sync

      - name: Run offline regression tests
        if: matrix.python-version == '3.10'
        run: uv run just test files='tests/test_eztv.py tests/test_torlock.py tests/test_limetorrents.py tests/test_torrentproject.py tests/test_piratebay.py tests/test_torrentscsv.py tests/test_jackett.py'

      - name: Run type check
        run: uv run just check

      - name: Lint code
        run: uv run just lint

      - name: Format code
        run: |
          uv run just format
          git diff --exit-code

      - name: Build code
        run: uv run just build
