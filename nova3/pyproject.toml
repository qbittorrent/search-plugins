[project]
name = "qBittorrent-search-plugins"
description = "Search plugins for qBittorrent search feature"
license = "GPL-2.0-or-later"
requires-python = ">= 3.7"
readme = "README.md"
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/qbittorrent/search-plugins"
source = "https://github.com/qbittorrent/search-plugins.git"
documentation = "https://github.com/qbittorrent/search-plugins/wiki"
issues = "https://github.com/qbittorrent/search-plugins/issues"

[dependency-groups]
dev = [
    "bandit",
    "mypy",
    "pycodestyle",
    "pyflakes",
    "pylint",
    "pyright",
    "pytest",
    "ruff",
    "rust-just",
    # workaround for https://github.com/uqfoundation/dill/issues/753
    "dill @ git+https://github.com/uqfoundation/dill.git@37d2bf717ac7ac110f06be5210f989847959c2cd ; python_version >= '3.15'"
]

[tool.bandit]
skips = ["B101", "B110", "B310", "B314", "B405"]

[tool.mypy]
mypy_path = "_aux"
strict = true

[tool.pylint]
disable = "C0103,C0114,C0115,C0116,E0401,R0801,R0902,R0903,R0912,R0914,R0915,R1702,W0223,W0511,W0603,W0613"
jobs = 0
max-line-length = 1000

[tool.pyright]
extraPaths = ["_aux"]
typeCheckingMode = "strict"

[tool.pytest]
addopts = ["--showlocals"]
pythonpath = ["_aux"]

[tool.ruff]
line-length = 1000

[tool.ruff.lint]
ignore = ["FA100", "RUF012", "SIM102", "S110"]

# workaround for https://github.com/uqfoundation/dill/issues/753
[[tool.uv.dependency-metadata]]
name = "dill"
version = "0.4.2.dev0"
requires-python = ">=3.10"
requires-dist = []
