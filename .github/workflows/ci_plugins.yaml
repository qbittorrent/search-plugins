name: CI - Plugins

on:
  pull_request:
    paths-ignore:
      - 'wiki/**'
  push:
    paths-ignore:
      - 'wiki/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15-dev']
    defaults:
      run:
        working-directory: nova3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup environment
        run: |
          pip install uv
          uv sync

      - name: Run tests
        if: matrix.python-version == '3.10' # avoid hammering the sites
        continue-on-error: true
        run: uv run just test

      - name: Run type check
        run: uv run just check

      - name: Lint code
        run: uv run just lint

      - name: Format code
        run: |
          uv run just format
          git diff --exit-code

      - name: Build code
        run: uv run just build
